<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkTree · My Links</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.5s ease;
    }
    body.dark-mode {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }
    .container {
      max-width: 720px;
      width: 100%;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 40px;
      padding: 2.5rem 2rem;
      box-shadow: 0 30px 60px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.2);
      transition: background 0.3s ease;
    }
    body.dark-mode .container {
      background: rgba(20,20,40,0.92);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .header-controls {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1.5rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .btn-toggle {
      background: rgba(0,0,0,0.05);
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #1a202c;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    body.dark-mode .btn-toggle {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    .btn-toggle:hover { transform: scale(0.95); }
    .btn-admin {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-admin:hover { transform: scale(0.95); opacity: 0.9; }
    .profile { text-align: center; margin-bottom: 2.5rem; }
    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      margin-bottom: 1rem;
      transition: transform 0.3s ease;
    }
    .profile-avatar:hover { transform: scale(1.05) rotate(-2deg); }
    .profile-name {
      font-size: 1.8rem;
      font-weight: 800;
      color: #1a202c;
      margin-bottom: 0.3rem;
    }
    body.dark-mode .profile-name { color: #fff; }
    .profile-bio {
      color: #4a5568;
      font-size: 1rem;
    }
    body.dark-mode .profile-bio { color: #a0aec0; }
    .profile-badge {
      display: inline-block;
      background: rgba(102,126,234,0.15);
      color: #667eea;
      padding: 0.2rem 1rem;
      border-radius: 60px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 0.5rem;
    }
    body.dark-mode .profile-badge {
      background: rgba(102,126,234,0.2);
    }
    .social-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.2rem;
    }
    .social-link {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4a5568;
      font-size: 1.2rem;
      transition: all 0.3s ease;
      text-decoration: none;
    }
    body.dark-mode .social-link {
      background: rgba(255,255,255,0.08);
      color: #a0aec0;
    }
    .social-link:hover {
      background: #667eea;
      color: white;
      transform: translateY(-3px) scale(1.05);
    }
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 0.5rem;
    }
    .link-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      background: white;
      border-radius: 20px;
      text-decoration: none;
      border: 1px solid #e2e8f0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      position: relative;
      overflow: hidden;
    }
    body.dark-mode .link-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .link-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: 20px;
    }
    .link-card:hover::before { opacity: 0.08; }
    .link-card:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 12px 30px rgba(102,126,234,0.25);
      border-color: #667eea;
    }
    .link-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
      background: rgba(102,126,234,0.1);
      color: #667eea;
      transition: all 0.3s ease;
      z-index: 1;
    }
    .link-card:hover .link-icon {
      background: #667eea;
      color: white;
      transform: scale(1.05);
    }
    body.dark-mode .link-icon {
      background: rgba(102,126,234,0.2);
    }
    .link-content {
      flex: 1;
      z-index: 1;
    }
    .link-title {
      font-weight: 600;
      font-size: 1rem;
      color: #1a202c;
      display: block;
    }
    body.dark-mode .link-title { color: #fff; }
    .link-url {
      font-size: 0.8rem;
      color: #718096;
      opacity: 0.7;
      word-break: break-all;
    }
    body.dark-mode .link-url { color: #a0aec0; }
    .link-arrow {
      color: #a0aec0;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      z-index: 1;
    }
    .link-card:hover .link-arrow {
      transform: translateX(4px);
      color: #667eea;
    }
    .footer {
      margin-top: 2.5rem;
      text-align: center;
      border-top: 1px solid #e2e8f0;
      padding-top: 1.5rem;
    }
    body.dark-mode .footer { border-top-color: rgba(255,255,255,0.08); }
    .footer-text {
      font-size: 0.8rem;
      color: #718096;
      opacity: 0.6;
    }
    .footer-text i { color: #e53e3e; animation: heartbeat 1.5s infinite; }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: #718096;
    }
    .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(102,126,234,0.1);
      border-radius: 50%;
      border-top-color: #667eea;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal Admin */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white;
      border-radius: 32px;
      padding: 2.5rem 2rem;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 30px 60px rgba(0,0,0,0.3);
    }
    body.dark-mode .modal {
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a202c;
    }
    body.dark-mode .modal-title { color: #fff; }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #a0aec0;
      transition: color 0.3s ease;
    }
    .modal-close:hover { color: #e53e3e; }
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      color: #4a5568;
      margin-bottom: 0.3rem;
    }
    body.dark-mode .form-group label { color: #a0aec0; }
    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      background: #f7fafc;
    }
    body.dark-mode .form-control {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.1);
      color: #fff;
    }
    .form-control:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
    }
    .btn-primary:hover { transform: scale(0.98); opacity: 0.9; }
    .btn-danger {
      background: #fc8181;
      color: white;
      border: none;
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-danger:hover { background: #e53e3e; }
    .btn-edit {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-edit:hover { opacity: 0.8; }
    .link-item-admin {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem;
      background: #f7fafc;
      border-radius: 12px;
      margin-bottom: 0.5rem;
    }
    body.dark-mode .link-item-admin {
      background: rgba(255,255,255,0.05);
    }
    .link-item-admin .info { flex: 1; }
    .link-item-admin .info .title {
      font-weight: 600;
      color: #1a202c;
    }
    body.dark-mode .link-item-admin .info .title { color: #fff; }
    .link-item-admin .info .url {
      font-size: 0.8rem;
      color: #718096;
    }
    body.dark-mode .link-item-admin .info .url { color: #a0aec0; }
    .link-item-admin .actions { display: flex; gap: 0.3rem; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.75rem 1.5rem;
      border-radius: 60px;
      font-weight: 500;
      z-index: 2000;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      background: #1a202c;
      color: white;
      max-width: 90%;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-0.5rem);
    }
    .toast.success { background: #48bb78; }
    .toast.error { background: #fc8181; }
    .toast.loading { background: #667eea; }

    @media (max-width: 550px) {
      .container { padding: 1.5rem 1.2rem; border-radius: 28px; }
      .profile-avatar { width: 90px; height: 90px; }
      .profile-name { font-size: 1.4rem; }
      .link-card { padding: 0.8rem 1.2rem; }
      .link-icon { width: 40px; height: 40px; font-size: 1.2rem; }
      .modal { padding: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header-controls">
    <button class="btn-toggle" id="themeToggle">
      <i class="fas fa-moon"></i> <span id="themeText">Mode Gelap</span>
    </button>
    <button class="btn-admin" id="adminToggle">
      <i class="fas fa-cog"></i> Kelola Link
    </button>
  </div>

  <div class="profile">
    <img src="https://ui-avatars.com/api/?name=Your+Name&size=120&background=667eea&color=fff&bold=true" alt="Profile" class="profile-avatar" id="profileAvatar">
    <h1 class="profile-name" id="profileName">Your Name</h1>
    <p class="profile-bio" id="profileBio">👋 Halo! Selamat datang di link saya</p>
    <span class="profile-badge">✨ LinkTree</span>

    <div class="social-links">
      <a href="#" class="social-link" id="socialInstagram"><i class="fab fa-instagram"></i></a>
      <a href="#" class="social-link" id="socialTwitter"><i class="fab fa-twitter"></i></a>
      <a href="#" class="social-link" id="socialYoutube"><i class="fab fa-youtube"></i></a>
      <a href="#" class="social-link" id="socialGithub"><i class="fab fa-github"></i></a>
    </div>
  </div>

  <div id="linksContainer" class="links-container">
    <div class="empty-state">
      <i class="fas fa-link"></i>
      <p>Memuat link...</p>
      <div class="loading" style="margin-top:1rem;"></div>
    </div>
  </div>

  <div class="footer">
    <p class="footer-text"><i class="fas fa-heart"></i> Auto-sync database</p>
  </div>
</div>

<!-- Admin Modal -->
<div class="modal-overlay" id="adminModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title"><i class="fas fa-cog"></i> Kelola Link</h2>
      <button class="modal-close" id="adminModalClose">&times;</button>
    </div>

    <div id="adminLinks"></div>

    <hr style="margin: 1.5rem 0; border-color: #e2e8f0;">

    <h3 style="margin-bottom: 1rem; color: #1a202c;">Tambah Link Baru</h3>
    <form id="addLinkForm">
      <div class="form-group">
        <label>Judul Link</label>
        <input type="text" class="form-control" id="adminTitle" placeholder="Contoh: GitHub" required>
      </div>
      <div class="form-group">
        <label>URL</label>
        <input type="url" class="form-control" id="adminUrl" placeholder="https://github.com" required>
      </div>
      <div class="form-group">
        <label>Icon (opsional)</label>
        <input type="text" class="form-control" id="adminIcon" placeholder="fa-brands fa-github">
        <small style="color: #718096;">Cari icon di <a href="https://fontawesome.com/icons" target="_blank">FontAwesome</a></small>
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">➕ Tambah Link</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  (function() {
    'use strict';

    // ================================================================
    // 🔑  HARCODE CONFIG DI SINI!
    //    Ganti dengan Bin ID dan Access Key Anda dari JSONBin
    // ================================================================
    const JSONBIN_CONFIG = {
      BIN_ID: '67f8a4b8e41b4d34e469c0e1',      // ← GANTI DENGAN BIN ID ANDA
      ACCESS_KEY: '$2a$10$abcdefghijklmnopqrstuv' // ← GANTI DENGAN ACCESS KEY ANDA
    };
    // ================================================================

    let links = [];
    let editingIndex = -1;
    let isDarkMode = localStorage.getItem('linktree_darkmode') === 'true';
    let isSaving = false;

    // ===== KONFIGURASI PROFIL =====
    const CONFIG = {
      profile: {
        name: 'Your Name',
        bio: '👋 Halo! Selamat datang di link saya',
        avatar: 'https://ui-avatars.com/api/?name=Your+Name&size=120&background=667eea&color=fff&bold=true'
      },
      social: {
        instagram: 'https://instagram.com/username',
        twitter: 'https://twitter.com/username',
        youtube: 'https://youtube.com/@username',
        github: 'https://github.com/username'
      }
    };

    // ===== DOM REFS =====
    const container = document.getElementById('linksContainer');
    const adminModal = document.getElementById('adminModal');
    const adminLinks = document.getElementById('adminLinks');
    const addLinkForm = document.getElementById('addLinkForm');
    const submitBtn = document.getElementById('submitBtn');
    const themeToggle = document.getElementById('themeToggle');
    const themeText = document.getElementById('themeText');
    const toast = document.getElementById('toast');

    // ===== FUNGSI JSONBIN =====

    function saveToJsonBin(data) {
      if (isSaving) return;
      if (!data || data.length === 0) {
        showToast('⚠️ Tidak ada data untuk disimpan!', 'error');
        return;
      }

      isSaving = true;
      showToast('💾 Menyimpan ke database...', 'loading');

      const payload = data.map(item => ({
        id: item.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        title: item.title || 'Link',
        url: item.url || '#',
        icon: item.icon || getDefaultIcon(item.title)
      }));

      fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_CONFIG.BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': JSONBIN_CONFIG.ACCESS_KEY,
          'X-Bin-Name': 'linktree-data'
        },
        body: JSON.stringify(payload)
      })
      .then(async response => {
        const text = await response.text();
        if (!response.ok) {
          let errorMsg = `HTTP ${response.status}`;
          try {
            const errorData = JSON.parse(text);
            if (errorData.message) errorMsg = errorData.message;
          } catch (e) {}
          throw new Error(errorMsg);
        }
        return JSON.parse(text);
      })
      .then(() => {
        showToast('✅ Data berhasil disimpan!', 'success');
        isSaving = false;
      })
      .catch(error => {
        showToast('⚠️ Gagal menyimpan: ' + error.message, 'error');
        isSaving = false;
        console.error('❌ Error save:', error);
      });
    }

    function loadFromJsonBin() {
      showToast('📥 Memuat data...', 'loading');

      fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_CONFIG.BIN_ID}`, {
        method: 'GET',
        headers: {
          'X-Master-Key': JSONBIN_CONFIG.ACCESS_KEY
        }
      })
      .then(async response => {
        const text = await response.text();
        if (!response.ok) {
          if (response.status === 404) {
            throw new Error('Bin tidak ditemukan!');
          }
          throw new Error(`HTTP ${response.status}`);
        }
        return JSON.parse(text);
      })
      .then(data => {
        let records = data.record || data;
        if (!Array.isArray(records)) {
          records = [records];
        }

        if (records && records.length > 0 && records[0] && typeof records[0] === 'object') {
          links = records.map(item => ({
            id: item.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
            title: item.title || 'Link',
            url: item.url || '#',
            icon: item.icon || getDefaultIcon(item.title)
          }));
          renderAll();
          showToast(`✅ ${links.length} link dimuat!`, 'success');
        } else {
          links = getDefaultLinks();
          renderAll();
          showToast('⚠️ Database kosong, pakai data default', 'error');
        }
      })
      .catch(error => {
        console.warn('❌ Error load:', error);
        links = getDefaultLinks();
        renderAll();
        showToast('📦 ' + error.message, 'error');
      });
    }

    // ===== FUNGSI LAIN =====

    function getDefaultLinks() {
      return [
        { id: '1', title: 'GitHub', url: 'https://github.com', icon: 'fa-brands fa-github' },
        { id: '2', title: 'YouTube', url: 'https://youtube.com', icon: 'fa-brands fa-youtube' },
        { id: '3', title: 'Twitter', url: 'https://twitter.com', icon: 'fa-brands fa-twitter' },
        { id: '4', title: 'Instagram', url: 'https://instagram.com', icon: 'fa-brands fa-instagram' },
      ];
    }

    function getDefaultIcon(title) {
      const icons = {
        'github': 'fa-brands fa-github',
        'youtube': 'fa-brands fa-youtube',
        'twitter': 'fa-brands fa-twitter',
        'instagram': 'fa-brands fa-instagram',
        'facebook': 'fa-brands fa-facebook',
        'linkedin': 'fa-brands fa-linkedin',
        'tiktok': 'fa-brands fa-tiktok',
        'whatsapp': 'fa-brands fa-whatsapp',
        'telegram': 'fa-brands fa-telegram',
        'discord': 'fa-brands fa-discord',
        'spotify': 'fa-brands fa-spotify',
        'google': 'fa-brands fa-google',
        'email': 'fa-solid fa-envelope',
        'website': 'fa-solid fa-globe',
        'blog': 'fa-solid fa-blog'
      };
      const lower = title.toLowerCase();
      for (const [key, icon] of Object.entries(icons)) {
        if (lower.includes(key)) return icon;
      }
      return 'fa-solid fa-link';
    }

    function renderAll() {
      renderLinks();
      renderAdminLinks();
    }

    function renderLinks() {
      container.innerHTML = '';
      if (!links || links.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-link"></i>
            <p>Belum ada link</p>
          </div>
        `;
        return;
      }

      links.forEach(link => {
        const card = document.createElement('a');
        card.className = 'link-card';
        card.href = link.url;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
        card.innerHTML = `
          <div class="link-icon"><i class="${link.icon || 'fa-solid fa-link'}"></i></div>
          <div class="link-content">
            <span class="link-title">${link.title}</span>
            <span class="link-url">${link.url}</span>
          </div>
          <div class="link-arrow"><i class="fas fa-chevron-right"></i></div>
        `;
        container.appendChild(card);
      });
    }

    function renderAdminLinks() {
      adminLinks.innerHTML = '';
      if (!links || links.length === 0) {
        adminLinks.innerHTML = '<p style="color: #718096;">Belum ada link. Tambahkan di bawah!</p>';
        return;
      }

      links.forEach((link, index) => {
        const div = document.createElement('div');
        div.className = 'link-item-admin';
        div.innerHTML = `
          <div class="info">
            <div class="title">${link.title}</div>
            <div class="url">${link.url}</div>
          </div>
          <div class="actions">
            <button class="btn-edit" data-index="${index}">✏️ Edit</button>
            <button class="btn-danger" data-index="${index}">Hapus</button>
          </div>
        `;
        adminLinks.appendChild(div);

        div.querySelector('.btn-edit').addEventListener('click', () => {
          editingIndex = index;
          document.getElementById('adminTitle').value = link.title;
          document.getElementById('adminUrl').value = link.url;
          document.getElementById('adminIcon').value = link.icon || '';
          submitBtn.textContent = '✏️ Update Link';
          submitBtn.style.background = 'linear-gradient(135deg, #f6ad55, #ed8936)';
        });

        div.querySelector('.btn-danger').addEventListener('click', () => {
          if (confirm(`Hapus link "${link.title}"?`)) {
            links.splice(index, 1);
            renderAll();
            showToast(`🗑️ "${link.title}" dihapus`, 'success');
          }
        });
      });
    }

    // ===== ADD/EDIT LINK =====
    addLinkForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const title = document.getElementById('adminTitle').value.trim();
      const url = document.getElementById('adminUrl').value.trim();
      const icon = document.getElementById('adminIcon').value.trim() || getDefaultIcon(title);

      if (!title || !url) {
        showToast('⚠️ Judul dan URL wajib diisi!', 'error');
        return;
      }

      if (editingIndex >= 0) {
        links[editingIndex] = { id: links[editingIndex].id, title, url, icon };
        editingIndex = -1;
        submitBtn.textContent = '➕ Tambah Link';
        submitBtn.style.background = '';
        showToast('✏️ Link berhasil diupdate!', 'success');
      } else {
        links.push({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
          title,
          url,
          icon
        });
        showToast('✅ Link berhasil ditambahkan!', 'success');
      }

      document.getElementById('adminTitle').value = '';
      document.getElementById('adminUrl').value = '';
      document.getElementById('adminIcon').value = '';
      renderAll();

      // Auto-save setelah tambah/edit
      saveToJsonBin(links);
    });

    // ===== DARK MODE =====
    function applyTheme() {
      if (isDarkMode) {
        document.body.classList.add('dark-mode');
        themeText.textContent = 'Mode Terang';
        themeToggle.innerHTML = '<i class="fas fa-sun"></i> <span id="themeText">Mode Terang</span>';
      } else {
        document.body.classList.remove('dark-mode');
        themeText.textContent = 'Mode Gelap';
        themeToggle.innerHTML = '<i class="fas fa-moon"></i> <span id="themeText">Mode Gelap</span>';
      }
    }

    themeToggle.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      localStorage.setItem('linktree_darkmode', isDarkMode);
      applyTheme();
    });

    // ===== MODAL CONTROLS =====
    document.getElementById('adminToggle').addEventListener('click', () => {
      adminModal.classList.add('active');
      renderAdminLinks();
    });

    document.getElementById('adminModalClose').addEventListener('click', () => {
      adminModal.classList.remove('active');
    });

    adminModal.addEventListener('click', (e) => {
      if (e.target === adminModal) adminModal.classList.remove('active');
    });

    // ===== TOAST =====
    let toastTimeout;

    function showToast(message, type = 'success') {
      toast.textContent = message;
      toast.className = 'toast ' + type;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ===== SETUP PROFIL =====
    function setupProfile() {
      document.getElementById('profileName').textContent = CONFIG.profile.name;
      document.getElementById('profileBio').textContent = CONFIG.profile.bio;
      document.getElementById('profileAvatar').src = CONFIG.profile.avatar;
    }

    function setupSocial() {
      const socialMap = {
        instagram: document.getElementById('socialInstagram'),
        twitter: document.getElementById('socialTwitter'),
        youtube: document.getElementById('socialYoutube'),
        github: document.getElementById('socialGithub')
      };
      for (const [key, element] of Object.entries(socialMap)) {
        const url = CONFIG.social[key];
        if (url && url !== '#') {
          element.href = url;
        } else {
          element.style.display = 'none';
        }
      }
    }

    // ===== INIT =====
    function init() {
      setupProfile();
      setupSocial();
      applyTheme();

      // Cek apakah config sudah diisi
      if (JSONBIN_CONFIG.BIN_ID === '6a44c8c1f5f4af5e294bee70' || 
          JSONBIN_CONFIG.ACCESS_KEY === '$2a$10$X7cSv4iZ2Mj.7/YyJchoK.ZAe9xYEQfG9ka5V.hDdsUUpqcTgwKaS') {
        showToast('⚠️ Ganti BIN_ID dan ACCESS_KEY di kode!', 'error');
        links = getDefaultLinks();
        renderAll();
        return;
      }

      loadFromJsonBin();
    }

    document.addEventListener('DOMContentLoaded', init);

  })();
</script>
</body>
</html>
