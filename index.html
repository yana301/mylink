<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkList · Database JSON</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: linear-gradient(145deg, #f7f9fc 0%, #eef2f7 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1rem; }
    .container { max-width: 720px; width: 100%; background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); border-radius: 48px; padding: 2rem 1.8rem; border: 1px solid rgba(255,255,255,0.5); }
    h1 { font-size: 2rem; font-weight: 600; color: #0b1b2f; margin-bottom: 0.2rem; }
    .subhead { font-size: 0.95rem; color: #4a5b6e; margin-bottom: 2rem; border-left: 4px solid #3b82f6; padding-left: 1rem; background: rgba(59,130,246,0.06); border-radius: 0 12px 12px 0; }
    .form-card { background: white; border-radius: 28px; padding: 1.5rem 1.2rem; margin-bottom: 2.2rem; }
    .input-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .input-group input { flex: 1 1 140px; padding: 0.85rem 1rem; border: 1.5px solid #e2e8f0; border-radius: 60px; font-size: 0.95rem; background: #fafcff; outline: none; }
    .input-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.12); }
    .btn { border: none; padding: 0.85rem 1.6rem; border-radius: 60px; font-weight: 600; font-size: 0.95rem; color: white; cursor: pointer; transition: 0.2s; background: #1e293b; }
    .btn:hover { background: #0f172a; transform: scale(0.97); }
    .btn-danger { background: #f1f5f9; color: #b91c1c; padding: 0.5rem 1rem; font-size: 0.8rem; }
    .btn-danger:hover { background: #fee2e2; }
    .btn-success { background: #dcfce7; color: #166534; padding: 0.5rem 1rem; font-size: 0.8rem; }
    .btn-success:hover { background: #bbf7d0; }
    .link-list-header { display: flex; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; }
    .link-list-header h2 { font-size: 1.3rem; color: #0b1b2f; }
    .link-counter { background: #e2e8f0; padding: 0.2rem 0.8rem; border-radius: 40px; font-size: 0.75rem; font-weight: 500; }
    .link-grid { display: flex; flex-direction: column; gap: 0.7rem; }
    .link-item { background: white; border-radius: 60px; padding: 0.4rem 0.4rem 0.4rem 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid #eef2f7; }
    .link-title { font-weight: 600; color: #0b1b2f; }
    .link-url { font-size: 0.8rem; color: #4b5b70; text-decoration: none; word-break: break-all; }
    .link-url:hover { color: #2563eb; }
    .link-actions { display: flex; gap: 0.3rem; }
    .empty-state { background: #f8fafc; border-radius: 60px; padding: 2rem 1.5rem; text-align: center; color: #64748b; border: 1.5px dashed #dce2ec; }
    .empty-state span { display: block; font-size: 2rem; margin-bottom: 0.3rem; }
    .footer-actions { margin-top: 1.8rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem; border-top: 1px solid #e2e8f0; padding-top: 1.5rem; }
    .toast-message { background: rgba(11,27,47,0.9); color: white; padding: 0.6rem 1.2rem; border-radius: 60px; position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity 0.25s ease; pointer-events: none; z-index: 999; }
    .toast-message.show { opacity: 1; }
    @media (max-width: 550px) {
      .container { padding: 1.5rem 1rem; }
      .input-group { flex-direction: column; }
      .btn { width: 100%; justify-content: center; }
      .link-item { flex-direction: column; align-items: stretch; padding: 0.8rem; }
      .link-actions { justify-content: flex-end; margin-top: 0.3rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📎 LinkList</h1>
    <div class="subhead">database dari data.json</div>
  </header>

  <div class="form-card">
    <form id="linkForm" class="input-group">
      <input type="text" id="titleInput" placeholder="Judul" required>
      <input type="url" id="linkInput" placeholder="https://" required>
      <button type="submit" class="btn">➕ Tambah</button>
    </form>
    <small style="color:#64748b; font-size:0.75rem; display:block; margin-top:0.5rem;">🔒 data disimpan di localStorage (hanya untuk Anda)</small>
  </div>

  <div class="link-list-header">
    <h2>📋 Daftar Link</h2>
    <span class="link-counter" id="linkCounter">0 tautan</span>
  </div>

  <div id="linkContainer" class="link-grid">
    <div class="empty-state" id="emptyState">
      <span>📭</span>
      loading data dari data.json...
    </div>
  </div>

  <div class="footer-actions">
    <div>
      <button id="loadBtn" class="btn btn-success" type="button">📥 Muat dari data.json</button>
      <button id="resetBtn" class="btn btn-danger" type="button">🔄 Reset ke default</button>
    </div>
    <button id="clearAllBtn" class="btn btn-danger" type="button">🗑️ Hapus semua</button>
  </div>
</div>

<div id="toast" class="toast-message">✨ selesai</div>

<script>
  (function() {
    'use strict';

    let links = [];
    let isDefaultData = false;

    // DOM refs
    const form = document.getElementById('linkForm');
    const titleInput = document.getElementById('titleInput');
    const linkInput = document.getElementById('linkInput');
    const linkContainer = document.getElementById('linkContainer');
    const emptyState = document.getElementById('emptyState');
    const linkCounter = document.getElementById('linkCounter');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const loadBtn = document.getElementById('loadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const toast = document.getElementById('toast');

    // Default data
    const DEFAULT_LINKS = [
      { id: 'gh', title: 'GitHub', url: 'https://github.com' },
      { id: 'yt', title: 'YouTube', url: 'https://youtube.com' },
      { id: 'tw', title: 'Twitter / X', url: 'https://twitter.com' },
    ];

    // Helper: save ke localStorage
    function saveToStorage() {
      try {
        localStorage.setItem('linklist_data', JSON.stringify(links));
      } catch (_) {}
    }

    // Helper: load dari localStorage
    function loadFromStorage() {
      try {
        const raw = localStorage.getItem('linklist_data');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length) {
            links = parsed;
            return true;
          }
        }
      } catch (_) {}
      return false;
    }

    // Generate ID
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    // Render
    function renderLinks() {
      while (linkContainer.firstChild) {
        linkContainer.removeChild(linkContainer.firstChild);
      }

      if (links.length === 0) {
        const emptyClone = emptyState.cloneNode(true);
        emptyClone.id = 'emptyState';
        emptyClone.innerHTML = `<span>📭</span>belum ada link, tambahkan sekarang!`;
        linkContainer.appendChild(emptyClone);
        linkCounter.textContent = '0 tautan';
        return;
      }

      linkCounter.textContent = links.length + ' tautan';

      links.forEach((item) => {
        const linkItem = document.createElement('div');
        linkItem.className = 'link-item';

        const infoDiv = document.createElement('div');
        infoDiv.style.display = 'flex';
        infoDiv.style.flexWrap = 'wrap';
        infoDiv.style.alignItems = 'center';
        infoDiv.style.gap = '0.3rem 0.8rem';
        infoDiv.style.flex = '1';

        const titleSpan = document.createElement('span');
        titleSpan.className = 'link-title';
        titleSpan.textContent = item.title || 'Tanpa judul';

        const urlAnchor = document.createElement('a');
        urlAnchor.className = 'link-url';
        urlAnchor.href = item.url;
        urlAnchor.target = '_blank';
        urlAnchor.rel = 'noopener noreferrer';
        urlAnchor.textContent = item.url;

        infoDiv.appendChild(titleSpan);
        infoDiv.appendChild(urlAnchor);

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'link-actions';

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn btn-danger';
        deleteBtn.textContent = 'Hapus';
        deleteBtn.setAttribute('type', 'button');
        deleteBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          deleteLinkById(item.id);
        });

        actionsDiv.appendChild(deleteBtn);
        linkItem.appendChild(infoDiv);
        linkItem.appendChild(actionsDiv);

        linkContainer.appendChild(linkItem);
      });
    }

    // Delete
    function deleteLinkById(id) {
      links = links.filter(link => link.id !== id);
      saveToStorage();
      renderLinks();
      showToast('🗑️ link dihapus');
    }

    // Add
    function addLink(title, url) {
      const cleanTitle = title.trim();
      let cleanUrl = url.trim();

      if (!cleanTitle) {
        showToast('⚠️ judul tidak boleh kosong', true);
        return false;
      }
      if (!cleanUrl) {
        showToast('⚠️ URL tidak boleh kosong', true);
        return false;
      }
      if (!/^https?:\/\//i.test(cleanUrl)) {
        cleanUrl = 'https://' + cleanUrl;
      }
      try {
        new URL(cleanUrl);
      } catch (_) {
        showToast('⚠️ format URL tidak valid', true);
        return false;
      }

      const newLink = {
        id: generateId(),
        title: cleanTitle,
        url: cleanUrl,
      };

      links.push(newLink);
      saveToStorage();
      renderLinks();
      showToast('✅ link tersimpan!');
      return true;
    }

    // Clear all
    function clearAllLinks() {
      if (links.length === 0) {
        showToast('📭 sudah kosong', true);
        return;
      }
      if (window.confirm('Hapus semua link yang tersimpan?')) {
        links = [];
        saveToStorage();
        renderLinks();
        showToast('🧹 semua link dihapus');
      }
    }

    // Load from data.json
    function loadFromJSON() {
      showToast('📥 memuat data.json...');
      fetch('data.json')
        .then(response => {
          if (!response.ok) {
            throw new Error('data.json tidak ditemukan! Buat file data.json di repository.');
          }
          return response.json();
        })
        .then(data => {
          if (!Array.isArray(data)) {
            throw new Error('Format data.json harus array');
          }
          const valid = data.every(item => item.title && item.url);
          if (!valid) {
            throw new Error('Data harus punya title & url');
          }

          // Generate ID baru
          const newLinks = data.map(item => ({
            id: generateId(),
            title: item.title,
            url: item.url,
          }));

          links = newLinks;
          saveToStorage();
          renderLinks();
          showToast('✅ berhasil muat ' + links.length + ' link dari data.json');
        })
        .catch(error => {
          showToast('⚠️ ' + error.message, true);
          console.error(error);
        });
    }

    // Reset ke default
    function resetToDefault() {
      if (window.confirm('Reset ke data default?')) {
        links = DEFAULT_LINKS.map(item => ({
          id: generateId(),
          title: item.title,
          url: item.url,
        }));
        saveToStorage();
        renderLinks();
        showToast('🔄 reset ke default');
      }
    }

    // Toast
    let toastTimeout = null;

    function showToast(message, isWarning = false) {
      toast.textContent = message;
      toast.style.background = isWarning ? 'rgba(180, 40, 40, 0.92)' : 'rgba(11, 27, 47, 0.92)';
      toast.classList.add('show');

      if (toastTimeout) {
        clearTimeout(toastTimeout);
        toastTimeout = null;
      }

      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
        toastTimeout = null;
      }, 2500);
    }

    // Event listeners
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const success = addLink(titleInput.value, linkInput.value);
      if (success) {
        titleInput.value = '';
        linkInput.value = '';
        titleInput.focus();
      }
    });

    clearAllBtn.addEventListener('click', clearAllLinks);
    loadBtn.addEventListener('click', loadFromJSON);
    resetBtn.addEventListener('click', resetToDefault);

    // Init
    if (!loadFromStorage()) {
      links = DEFAULT_LINKS.map(item => ({
        id: generateId(),
        title: item.title,
        url: item.url,
      }));
      saveToStorage();
    }
    renderLinks();
    titleInput.focus();

    // Auto-load data.json jika ada
    setTimeout(() => {
      fetch('data.json')
        .then(res => {
          if (res.ok) {
            // Ada data.json, tapi kita biarkan user yang klik tombol
          }
        })
        .catch(() => {});
    }, 500);

  })();
</script>

</body>
</html>
